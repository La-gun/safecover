name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Dependency audit (high severity+)
        run: npm audit --audit-level=high
        continue-on-error: true # advisory for now — see docs/ recommendations backlog to make this blocking

      - name: Verify server boots
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Server healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not become healthy in time"
          kill $SERVER_PID || true
          exit 1
